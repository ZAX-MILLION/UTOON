name: Foundation Guard

on:
  push:
  pull_request:

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify repository foundation gates
        run: node scripts/verify-foundation.mjs
